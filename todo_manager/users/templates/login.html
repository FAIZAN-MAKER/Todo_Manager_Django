{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TodoManager</title>
    <link rel="icon" href="{% static 'image/icon.png' %}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple-50: #EEEDFE; --purple-600: #534AB7; --purple-800: #3C3489;
            --green-50: #EAF3DE; --green-600: #3B6D11;
            --red-50: #FCEBEB; --red-600: #A32D2D;
            --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
            --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
            --radius-md: 8px; --radius-lg: 12px;
            --bg-body: #f4f5f8;
            --bg-surface: #ffffff;
            --border-light: rgba(0,0,0,0.06);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.06);
        }

        [data-theme="dark"] {
            --purple-50: #2a2547; --purple-600: #8B7FDF; --purple-800: #A99EE8;
            --green-50: #1c2e14; --green-600: #6BBF2B;
            --red-50: #2e1a1a; --red-600: #E85454;
            --gray-50: #161922; --gray-100: #1e2230; --gray-200: #2a2f3f;
            --gray-400: #7a8398; --gray-600: #a0a8ba; --gray-900: #e4e9f2;
            --bg-body: #0d0f16;
            --bg-surface: #151821;
            --border-light: rgba(255,255,255,0.05);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background 0.3s ease;
        }

        .auth-card {
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 44px 40px 36px;
            width: 420px;
            max-width: 100%;
            border: var(--border-light);
            box-shadow: var(--shadow-md);
            transition: background 0.3s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 28px;
        }
        .brand-icon {
            width: 34px; height: 34px;
            background: var(--purple-600);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        .brand-name {
            font-size: 17px; font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }
        .brand-sub {
            font-size: 12px; color: var(--gray-400);
            margin-left: auto;
        }

        .auth-card h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 4px;
        }
        .auth-card .sub {
            font-size: 14px;
            color: var(--gray-400);
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            border: 0.5px solid var(--gray-200);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--gray-900);
            background: var(--gray-50);
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-group input:focus {
            border-color: var(--purple-600);
            box-shadow: 0 0 0 3px rgba(83,74,183,0.08);
            background: var(--bg-surface);
        }
        .form-group .errorlist {
            list-style: none;
            font-size: 12px;
            color: var(--red-600);
            margin-bottom: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--purple-600);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.2s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: var(--purple-800);
            transform: translateY(-1px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--gray-400);
        }
        .auth-footer a {
            color: var(--purple-600);
            text-decoration: none;
            font-weight: 500;
        }

        .theme-toggle-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
        }
        .theme-btn {
            background: var(--gray-100);
            border: none;
            width: 36px; height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--gray-600);
            font-size: 18px;
            transition: background 0.2s, transform 0.2s;
        }
        .theme-btn:hover {
            background: var(--gray-200);
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px 28px; }
        }
    </style>
</head>
<body>
    <div class="theme-toggle-wrap">
        <button class="theme-btn" id="themeToggle" title="Toggle dark mode">
            <i class="ti ti-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="auth-card">
        <a href="{% url 'homepage' %}" class="brand-row">
            <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
            <span class="brand-name">TodoManager</span>
            <span class="brand-sub">Sign in</span>
        </a>

        <h1>Welcome back</h1>
        <p class="sub">Sign in to access your tasks.</p>

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">
                <i class="ti ti-login" style="font-size:15px"></i>
                Sign in
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Sign up</a>
        </div>
    </div>

    <script>
        var html = document.documentElement;
        var btn = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');

        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            icon.className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }

        var saved = localStorage.getItem('theme');
        if (saved) {
            setTheme(saved);
        } else {
            setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        btn.addEventListener('click', function () {
            setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
