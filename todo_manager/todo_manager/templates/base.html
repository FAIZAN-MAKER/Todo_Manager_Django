{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TodoManager{% endblock %}</title>
    <link rel="icon" href="{% static 'image/icon.png' %}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --purple-50: #EEEDFE; --purple-600: #534AB7; --purple-800: #3C3489;
            --green-50: #EAF3DE; --green-600: #3B6D11;
            --amber-50: #FAEEDA; --amber-600: #854F0B;
            --red-50: #FCEBEB; --red-600: #A32D2D;
            --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
            --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
            --radius-md: 8px; --radius-lg: 12px;
            --border: 0.5px solid rgba(0,0,0,0.09);
        }
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #f4f5f8; min-height: 100vh; color: var(--gray-900); -webkit-font-smoothing: antialiased; }

        .navbar { background: #fff; border-bottom: var(--border); padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 58px; position: sticky; top: 0; z-index: 1000; }
        .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .brand-icon { width: 30px; height: 30px; background: var(--purple-600); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
        .brand-name { font-size: 15px; font-weight: 600; color: var(--gray-900); letter-spacing: -0.2px; }
        .nav-links { list-style: none; display: flex; gap: 2px; align-items: center; }
        .nav-links a { font-size: 13.5px; color: var(--gray-600); text-decoration: none; padding: 6px 12px; border-radius: var(--radius-md); transition: background 0.15s, color 0.15s; }
        .nav-links a:hover { background: var(--gray-100); color: var(--gray-900); }
        .nav-links a.active { background: var(--purple-50); color: var(--purple-600); font-weight: 500; }
        .nav-cta { margin-left: 10px; font-size: 13px; font-weight: 500; color: #fff !important; background: var(--purple-600); padding: 7px 16px; border-radius: var(--radius-md); text-decoration: none; transition: background 0.15s; }
        .nav-cta:hover { background: var(--purple-800) !important; }

        .content { max-width: 960px; margin: 0 auto; padding: 36px 20px; }

        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
        .toast { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #fff; border-radius: var(--radius-md); border: var(--border); border-left: 2px solid var(--green-600); box-shadow: 0 4px 20px rgba(0,0,0,0.09); animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1); transition: opacity 0.35s, transform 0.35s; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .toast-icon { flex-shrink: 0; width: 24px; height: 24px; background: var(--green-50); color: var(--green-600); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast-msg { flex: 1; font-size: 13px; font-weight: 500; color: var(--gray-900); }
        .toast-close { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--gray-400); font-size: 18px; cursor: pointer; border-radius: 5px; transition: background 0.15s; line-height: 1; }
        .toast-close:hover { background: var(--gray-100); color: var(--gray-900); }
        .toast-error { border-left-color: var(--red-600); }
        .toast-error .toast-icon { background: var(--red-50); color: var(--red-600); }
        .toast-warning { border-left-color: var(--amber-600); }
        .toast-warning .toast-icon { background: var(--amber-50); color: var(--amber-600); }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'homepage' %}" class="brand">
            <div class="brand-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
            <span class="brand-name">TodoManager</span>
        </a>
        <ul class="nav-links">
            <li><a href="{% url 'homepage' %}" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
            <li><a href="{% url 'todolist' %}" class="{% if '/todolist' in request.path %}active{% endif %}">Tasks</a></li>
            <li><a href="{% url 'about' %}" class="{% if '/about/' in request.path %}active{% endif %}">About</a></li>
            <li><a href="{% url 'contact' %}" class="{% if '/contact/' in request.path %}active{% endif %}">Contact</a></li>
            <a href="{% url 'todolist' %}" class="nav-cta">+ New task</a>
        </ul>
    </nav>

    {% if messages %}
    <div class="toast-container">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}" role="alert">
            <div class="toast-icon"><i class="ti ti-check" style="font-size:13px"></i></div>
            <span class="toast-msg">{{ message }}</span>
            <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="content">{% block content %}{% endblock %}</div>

    {% block extra_js %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.toast').forEach(function (t) {
                setTimeout(function () { t.style.opacity='0'; t.style.transform='translateX(16px)'; setTimeout(function(){t.remove();},350); }, 3500);
            });
        });
    </script>
    {% endblock %}
</body>
</html>
